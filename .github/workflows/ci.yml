name: CI

on:
    pull_request:
    push:
        branches:
        - main

permissions:
    contents: read

jobs:
    test:
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                os: [ubuntu-24.04, macos-14, windows-2022]
        steps:
        - name: Checkout code
          uses: actions/checkout@v4
        - name: Set up Go
          uses: actions/setup-go@v5
          with:
            go-version-file: go.mod
            cache: true
        - name: Run tests
          run: |
            go vet ./...
            gofmt -l
            make test