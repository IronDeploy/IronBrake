name: Falso positivo
description: Um comando seguro que foi barrado ou pediu confirmação sem necessidade
title: "falso positivo: "
labels: ["falso-positivo"]
body:
  - type: markdown
    attributes:
      value: |
        **Não cole segredos** (chaves, tokens, senhas) **nem o conteúdo do `audit.log`**.
        Troque valores sensíveis do comando por `XXXX` antes de colar.
  - type: input
    id: version
    attributes:
      label: Versão do iron
      description: Saída de `iron version`
      placeholder: iron 0.3.0
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Comando barrado
      description: O comando exato, sem segredos
      render: shell
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Motivo mostrado
      description: A mensagem que o iron exibiu ao barrar
      render: text
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Por que o comando é seguro
      description: Em que contexto ele roda e por que não causa dano
    validations:
      required: true
