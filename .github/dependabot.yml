version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies

  # As actions ficam fixadas por SHA; o Dependabot atualiza o SHA e o comentário de versão.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
    groups:
      # init e analyze precisam estar na mesma versão, senão o CodeQL falha.
      codeql-action:
        patterns:
          - "github/codeql-action*"
